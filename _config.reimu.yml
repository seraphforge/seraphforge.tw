# =========================================================
# Seraph Blog - Reimu Theme Config
# 檔案位置：_config.reimu.yml
# =========================================================

menu:
  - name: Home
    url: /
    icon:
  - name: Archives
    url: /archives
    icon:
  - name: About
    url: /about
    icon:
  - name: Works
    url: /works
    icon:

subtitle:
  typing:
    enable: true
    strings:
      - I believe my story will be seen one day.
      - Cybersecurity / CTF / Web Development / Robotics
    typeSpeed: 100
    backSpeed: 50
    backDelay: 2000
    startDelay: 300
    loop: true
    shuffle: false
    showCursor: true
    cursorChar: "|"
    smartBackspace: false

banner: "/images/banner.jpg"

banner_srcset:
  enable: false

favicon: "/images/05.jpg"

avatar: "avatar.png"

cover: "/images/default-cover.jpg"

toc: true

toc_options:
  list_number: true
  min_depth: 2
  max_depth: 4

open_graph:
  enable: true
  options:
    default_og_image: /images/banner.jpg

excerpt_link: Read More
rss: 

footer:
  since: 2025
  powered: true
  count: true
  busuanzi: false
  icon:
    url: "./images/taichi.png"
    rotate: false
    mask: true

sidebar:
  position: left
  menu: true
  article:
    show_common: true

social: {}

# =========================================================
# Widgets / Sidebar
# =========================================================

widgets:
  - archive
  - recent_posts

archive_type: "monthly"

# false = 不顯示 2、1 那種文章數量
show_count: false

recent_posts_limits: 5

only_show_capsule_in_index: false
uppercase_capsule: false
show_update_time: false

summary:
  enable: false
  style: "subtitle"

i18n:
  enable: false
  type: [page, post]
  generator: [archive, category, tag, index]
  languages: [en, zh-TW]

triangle_badge:
  enable: false
  icon:
  link:

layout:
  max_width: 1350px

anchor_icon:

reimu_cursor:
  enable: false
  cursor:
    default: ../images/cursor/reimu-cursor-default.png
    pointer: ../images/cursor/reimu-cursor-pointer.png
    text: ../images/cursor/reimu-cursor-text.png

icon_font: 4552607_ex15nbittbh

custom_font:
  enable: false
  article:
  code:

font:
  enable: true
  article:
    - Mulish
    - Noto Serif TC
    - Noto Sans TC
  code:
    - JetBrains Mono

local_font:
  article:
    - "-apple-system"
    - BlinkMacSystemFont
    - "Segoe UI"
    - "PingFang TC"
    - "Microsoft JhengHei"
    - sans-serif
  code:
    - Menlo
    - Monaco
    - Consolas
    - monospace

dark_mode:
  enable: auto

math:
  enable: false
  katex:
    enable: true
    autoRender: false
  mathjax:
    enable: false
    options:

mermaid:
  enable: false

comment:
  title:
    en: Leave a comment
    zh-CN: 说些什么吧！
    zh-TW: 說些什麼吧！
    ja: コメントを残す
  default:

disqus:
  enable: false
  shortname:
  count: true

valine:
  enable: false

waline:
  enable: false

twikoo:
  enable: false

giscus:
  enable: false

artalk:
  enable: false

algolia_search:
  enable: false
  hits:
    per_page: 10

generator_search:
  enable: false
  field: post
  content: true

preloader:
  enable: false
  text:
    zh-CN: Loading...
    zh-TW: Loading...
    en: Loading...
    ja: Loading...
  icon:
  rotate: false

animation:
  enable: false
  options:
    header:
      title: slide-up
      subTitle: slide-down
    home:
      post: fade-up
      widget: fade-up
      sidebar: fade-up
    article:
      whole: fade-up
      date: zoom-in
      category: zoom-in
      tag: zoom-in
      comment: zoom-in
      reading: zoom-in
      nav: fade-up
    archive:
      whole: fade-up
      tag: zoom-in
      category: zoom-in
      section: fade-up
      nav: fade-up

firework:
  enable: false
  disable_on_mobile: true
  options:
    excludeElements: ["a", "button"]

pjax:
  enable: false

quicklink:
  enable: false
  timeout: 3000
  priority: true
  ignores: []

pace:
  enable: false

service_worker:
  enable: false

live2d:
  enable: false
  position: left

live2d_widgets:
  enable: false
  position: left

player:
  disable_on_mobile: true
  position: before_sidebar
  aplayer:
    enable: false
    options:
      audio: []
      fixed:
      autoplay:
      loop:
      order:
      preload:
      volume:
      mutex:
      listFolded:
      lrcType:
  meting:
    enable: false
    meting_api:
    options:
      id:
      server:
      type:
      auto:

pangu:
  enable: true

lazyload:
  enable: true

cdn:
  enable: false

# =========================================================
# Injector
# 1. 載入 custom.css
# 2. 隱藏 friend / 友鏈
# 3. 強制黑色模式
# 4. 移除主題切換按鈕
# =========================================================

injector:
  head_end: |
    <link rel="stylesheet" href="/seraphforge.tw/css/custom.css">
    <style>
      a[href*="friend"],
      a[href*="friend/"],
      a[href*="/friend"],
      a[href*="/friend/"],
      li:has(a[href*="friend"]),
      .menu-item:has(a[href*="friend"]),
      .nav-item:has(a[href*="friend"]) {
        display: none !important;
      }
    </style>

  body_end:
