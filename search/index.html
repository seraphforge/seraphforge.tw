  (function() {
    var menuButton = document.querySelector('.mobile-menu-button');
    var menu = document.getElementById('mobile-nav');

    function closeMenu() {
      if (!menuButton || !menu) return;
      menuButton.setAttribute('aria-expanded', 'false');
      menu.hidden = true;

    function updateHeaderState() {

    }

    updateHeaderState();
    window.addEventListener('scroll', updateHeaderState, { passive: true });

    if (!menuButton || !menu) return;
    menuButton.addEventListener('click', function() {
      var isOpen = menuButton.getAttribute('aria-expanded') === 'true';
      menuButton.setAttribute('aria-expanded', String(!isOpen));
      menu.hidden = isOpen;
    });
    menu.addEventListener('click', function(event) {
      if (event.target && event.target.closest('a')) closeMenu();
    });
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeMenu();
    });
  })();

  <article class="page-content notebook-page">
    <header class="page-header">
      <div class="page-kicker">Notebook Page</div>
      <h1 class="section-title">Search</h1>
    </header>

    <div class="page-body">
      
        <div class="search-box-wrap">
          <input id="local-search-input" class="search-input" type="text" placeholder="Search posts..." autocomplete="off" />
          <div id="local-search-results" class="search-results"></div>
        </div>

        <script>
          (async function () {
            const input = document.getElementById('local-search-input');
            const results = document.getElementById('local-search-results');
            let posts = [];

            try {
              const res = await fetch('/seraphforge.tw/search.json');
              posts = await res.json();
            } catch (err) {
              results.innerHTML = '<p>Failed to load search index.</p>';
              return;
            }

            function escapeHtml(str) {
              return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
            }

            function stripHtml(html) {
              const div = document.createElement('div');
              div.innerHTML = html;
              return div.textContent || div.innerText || '';
            }

            function highlight(text, keyword) {
              if (!keyword) return escapeHtml(text);
              const escaped = escapeHtml(text);
              const pattern = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig');
              return escaped.replace(pattern, '<mark>$1</mark>');
            }

            function normalizeSearchUrl(url) {
              const value = String(url || '/');
              if (/^https?:\/\//i.test(value)) return value;
              return value.replace(/^\/+/, '/');
            }

            function renderResults(list, keyword) {
              if (!keyword.trim()) {
                results.innerHTML = '<p class="search-hint">Type something to search.</p>';
                return;
              }

              if (!list.length) {
                results.innerHTML = '<p class="search-empty">No matching posts found.</p>';
                return;
              }

              results.innerHTML = list.map(post => {
                const rawText = stripHtml(post.content || '');
                const excerpt = rawText.slice(0, 180);
                return `
                  <article class="search-result-item">
                    <div class="search-result-date">${post.date ? post.date.slice(0, 10) : ''}</div>
                    <div class="search-result-main">
                      <a class="search-result-title" href="${normalizeSearchUrl(post.url)}">${highlight(post.title || 'Untitled', keyword)}</a>
                      <p class="search-result-excerpt">${highlight(excerpt, keyword)}...</p>
                    </div>
                  </article>
                `;
              }).join('');
            }

            input.addEventListener('input', function () {
              const keyword = this.value.toLowerCase().trim();
              const matched = posts.filter(post => {
                const title = (post.title || '').toLowerCase();
                const content = stripHtml(post.content || '').toLowerCase();
                return title.includes(keyword) || content.includes(keyword);
              });
              renderResults(matched, this.value.trim());
            });

            renderResults([], '');
          })();
        </script>
      
    </div>
  </article>

  <script>
    (function() {
      var copyButtons = Array.prototype.slice.call(document.querySelectorAll('[data-copy-email]'));
      copyButtons.forEach(function(button) {
        var originalText = button.textContent;
        button.addEventListener('click', function() {
          var email = button.getAttribute('data-copy-email') || '';
          var status = button.parentElement ? button.parentElement.querySelector('[data-copy-email-status]') : null;
          if (!email || !navigator.clipboard || !navigator.clipboard.writeText) return;
          navigator.clipboard.writeText(email).then(function() {
            var isZh = document.documentElement.lang === 'zh-Hant';
            button.textContent = isZh ? '已複製' : 'Copied';
            if (status) status.textContent = isZh ? '已複製' : 'Copied';
            window.setTimeout(function() {
              button.textContent = originalText;
              if (status) status.textContent = '';
            }, 1800);
          }).catch(function() {
            return;
          });
        });
      });
    })();
  </script>
